{% extends "base.html" %}

{% block title %}選手註冊 | 拉屎冠軍爭霸賽{% endblock %}

{% block extra_css %}
<style>
    .auth-card {
        background-color: var(--white);
        border-radius: 24px;
        padding: 40px;
        max-width: 480px;
        width: 100%;
        margin: 40px auto;
        box-shadow: var(--card-shadow);
        border: 1px solid var(--accent-light);
        text-align: center;
    }

    .auth-title {
        font-size: 24px;
        font-weight: 800;
        color: var(--primary-dark);
        margin-bottom: 8px;
    }

    .auth-subtitle {
        color: var(--text-muted);
        font-size: 14px;
        margin-bottom: 30px;
    }

    .form-group {
        text-align: left;
        margin-bottom: 20px;
    }

    .form-group label {
        display: block;
        font-weight: 600;
        font-size: 14px;
        color: var(--primary-dark);
        margin-bottom: 8px;
    }

    .form-control {
        width: 100%;
        padding: 14px 16px;
        border: 2px solid var(--accent-light);
        border-radius: 12px;
        font-family: inherit;
        font-size: 15px;
        color: var(--text-main);
        outline: none;
        transition: var(--transition-smooth);
        background-color: var(--white);
    }

    .form-control:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(141, 110, 99, 0.15);
    }

    .team-desc-hint {
        margin-top: 6px;
        font-size: 12px;
        color: var(--primary);
        display: block;
    }

    .btn-submit {
        display: block;
        width: 100%;
        background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        color: var(--white);
        border: none;
        padding: 16px;
        border-radius: 16px;
        font-size: 16px;
        font-weight: 800;
        cursor: pointer;
        transition: var(--transition-smooth);
        margin-top: 10px;
        box-shadow: 0 8px 24px rgba(93, 64, 55, 0.15);
    }

    .btn-submit:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 30px rgba(93, 64, 55, 0.25);
    }

    .auth-footer {
        margin-top: 24px;
        font-size: 14px;
        color: var(--text-muted);
    }

    .auth-footer a {
        color: var(--primary);
        font-weight: 600;
        text-decoration: none;
        transition: var(--transition-smooth);
    }

    .auth-footer a:hover {
        text-decoration: underline;
    }
</style>
{% endblock %}

{% block content %}
<div class="auth-card">
    <div class="auth-title">🏆 成為參賽選手</div>
    <div class="auth-subtitle">註冊以創建個人腸胃紀錄，並加入戰隊為榮譽而戰</div>

    <form action="{{ url_for('auth.register') }}" method="POST">
        <div class="form-group">
            <label for="username">選手帳號名稱</label>
            <input type="text" id="username" name="username" class="form-control" placeholder="請設定您的帳號" required>
        </div>
        <div class="form-group">
            <label for="password">密碼</label>
            <input type="password" id="password" name="password" class="form-control" placeholder="請設定密碼" required>
        </div>
        <div class="form-group">
            <label for="team_id">選擇您的陣營 / 戰隊</label>
            <select id="team_id" name="team_id" class="form-control" onchange="updateTeamHint(this)" required>
                <option value="" disabled selected>-- 請選擇一個戰隊 --</option>
                {% for team in teams %}
                    <option value="{{ team.id }}" data-desc="{{ team.description }}">{{ team.name }}</option>
                {% endfor %}
            </select>
            <small id="team-hint" class="team-desc-hint"></small>
        </div>
        <button type="submit" class="btn-submit">建立選手帳號</button>
    </form>

    <div class="auth-footer">
        已經是選手？ <a href="{{ url_for('auth.login') }}">按此登入</a>
    </div>
</div>

<script>
function updateTeamHint(selectElement) {
    const selectedOption = selectElement.options[selectElement.selectedIndex];
    const desc = selectedOption.getAttribute('data-desc');
    const hintElement = document.getElementById('team-hint');
    if (desc) {
        hintElement.textContent = "🏆 戰隊理念：" + desc;
    } else {
        hintElement.textContent = "";
    }
}
</script>
{% endblock %}
